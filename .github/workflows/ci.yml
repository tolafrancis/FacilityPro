# Runs on every push and pull request: type-check + production build,
# translation key check, and every migration on a fresh Postgres followed by
# the database security/behaviour suites (supabase/security-tests).
name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:i18n
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrations on a fresh database + security suites
        run: supabase/security-tests/run.sh

  iot-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iot-gateway/package-lock.json
      - run: npm ci
      # Simulated Modbus TCP meter + local MQTT broker.
      - run: npm test

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/_shared/iot-adapters.test.ts
      # process-outbox is left out: its esm.sh web-push import has no usable types.
      - run: deno check $(ls supabase/functions/*/index.ts | grep -v process-outbox)
